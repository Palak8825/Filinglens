# FilingLens theme. Light and dark are both designed (not an automatic flip); the chart palette is the
# validated categorical order (CVD-checked adjacent pairs), stepped separately for each surface.

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
baseFontSize = 15

[theme.light]
base = "light"
primaryColor = "#256abf"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#eceff4"
textColor = "#14171f"
borderColor = "#dde2ea"
linkColor = "#1c5cab"
dataframeHeaderBackgroundColor = "#eceff4"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#131312"
secondaryBackgroundColor = "#1f1f1d"
textColor = "#f0efec"
borderColor = "#33332f"
linkColor = "#86b6ef"
dataframeHeaderBackgroundColor = "#1f1f1d"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]
